<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - SchemeSeeker</title>
  <meta name="description" content="View and update your SchemeSeeker profile details.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=20260729">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="bi bi-search-heart"></i>
        <span data-i18n="appName">SchemeSeeker</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <i class="bi bi-list" style="font-size: 1.5rem;"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item">
            <a class="nav-link" href="/" data-i18n="home"><i class="bi bi-house-door"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/form" data-i18n="findSchemes"><i class="bi bi-search"></i> Find Schemes</a>
          </li>
          <li class="nav-item ms-lg-2">
            <div class="lang-switcher">
              <button class="lang-btn active" data-lang="en">EN</button>
              <button class="lang-btn" data-lang="bn">BN</button>
            </div>
          </li>
        </ul>
        <ul class="navbar-nav ms-lg-3" id="authNav"></ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body text-center py-5">
            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 84px; height: 84px; font-size: 2rem;">
              <i class="bi bi-person-circle"></i>
            </div>
            <h3 id="profileName" class="mb-2">Loading...</h3>
            <p id="profileEmail" class="text-secondary mb-0">Loading...</p>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div>
                <h4 class="mb-1">My Profile</h4>
                <p class="text-secondary mb-0">Keep your details updated for better match results.</p>
              </div>
            </div>

            <form id="profileForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="name" class="form-label">Full Name</label>
                  <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label">Email Address</label>
                  <input type="email" id="email" name="email" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                  <label for="age" class="form-label">Age</label>
                  <input type="number" id="age" name="age" class="form-control" min="0" max="120">
                </div>
                <div class="col-md-6">
                  <label for="gender" class="form-label">Gender</label>
                  <select id="gender" name="gender" class="form-select">
                    <option value="">Select</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="annual_income" class="form-label">Annual Income (Rs.)</label>
                  <input type="number" id="annual_income" name="annual_income" class="form-control">
                </div>
                <div class="col-md-6">
                  <label for="occupation" class="form-label">Occupation</label>
                  <select id="occupation" name="occupation" class="form-select">
                    <option value="">Select</option>
                    <option value="farmer">Farmer</option>
                    <option value="student">Student</option>
                    <option value="unemployed">Unemployed</option>
                    <option value="self_employed">Self Employed</option>
                    <option value="private_sector">Private Sector</option>
                    <option value="government">Government Employee</option>
                    <option value="homemaker">Homemaker</option>
                    <option value="retired">Retired</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="education_level" class="form-label">Education</label>
                  <select id="education_level" name="education_level" class="form-select">
                    <option value="">Select</option>
                    <option value="none">No Formal</option>
                    <option value="primary">Primary</option>
                    <option value="8th">Class 8</option>
                    <option value="10th">Class 10</option>
                    <option value="12th">Class 12</option>
                    <option value="graduate">Graduate</option>
                    <option value="postgraduate">Postgraduate</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="caste_category" class="form-label">Caste Category</label>
                  <select id="caste_category" name="caste_category" class="form-select">
                    <option value="">Select</option>
                    <option value="general">General</option>
                    <option value="sc">SC</option>
                    <option value="st">ST</option>
                    <option value="obc">OBC</option>
                    <option value="minority">Minority</option>
                  </select>
                </div>
                <div class="col-12">
                  <label for="district" class="form-label">District</label>
                  <input type="text" id="district" name="district" class="form-control">
                </div>
              </div>

              <button type="submit" class="btn btn-primary mt-4">
                <i class="bi bi-check-circle"></i> Save Changes
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
