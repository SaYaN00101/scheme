<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Schemes - SchemeSeeker</title>
  <meta name="description" content="View and manage your saved government schemes.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="bi bi-search-heart"></i> SchemeSeeker
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <i class="bi bi-list" style="font-size: 1.5rem;"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house-door"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/form"><i class="bi bi-search"></i> Find Schemes</a></li>
          <li class="nav-item"><a class="nav-link active" href="/saved"><i class="bi bi-bookmark-fill"></i> Saved Schemes</a></li>
          <li class="nav-item ms-lg-2">
            <div class="lang-switcher">
              <button class="lang-btn active" data-lang="en">EN</button>
              <button class="lang-btn" data-lang="bn">BN</button>
            </div>
          </li>
        </ul>
        <ul class="navbar-nav ms-lg-3" id="authNav"></ul>
      </div>
    </div>
  </nav>

  <section class="results-header">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-8">
          <h1 class="text-white mb-2"><i class="bi bi-bookmark-fill"></i> Saved Schemes</h1>
          <p class="text-white-50 mb-0">Your shortlisted government schemes for later review.</p>
        </div>
        <div class="col-lg-4 text-lg-end mt-3 mt-lg-0">
          <a href="/results?browse=all" class="btn btn-outline-light">
            <i class="bi bi-grid"></i> Browse All Schemes
          </a>
        </div>
      </div>
    </div>
  </section>

  <section class="py-5" style="background: var(--body-bg);">
    <div class="container">
      <div class="row g-4" id="savedSchemesContainer">
        <div class="col-12 text-center py-5">
          <div class="spinner mx-auto mb-3"></div>
          <p class="text-secondary">Loading your saved schemes...</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer mt-auto">
    <div class="container">
      <div class="footer-bottom">
        <p class="mb-0">&copy; 2026 SchemeSeeker. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
